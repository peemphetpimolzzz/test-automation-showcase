name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm unit
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run API + contract tests
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm apitest
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  e2e:
    runs-on: ubuntu-latest
    needs: [unit, api]
    steps:
      - uses: actions/checkout@v4
      - name: Run end-to-end tests against the full stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose down -v

  load:
    runs-on: ubuntu-latest
    needs: [unit, api]
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 smoke load test
        run: |
          cp .env.example .env
          docker compose up -d --build
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm k6
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: load/k6-summary.json
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose down -v
