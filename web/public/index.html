<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="board">
      <h1>Task Board</h1>

      <form id="add-form" class="add-form">
        <input
          id="title-input"
          name="title"
          type="text"
          placeholder="What needs doing?"
          autocomplete="off"
          required
        />
        <button type="submit" id="add-button">Add task</button>
      </form>

      <p id="empty-state" class="empty" hidden>No tasks yet. Add one above.</p>

      <ul id="task-list" class="task-list" data-testid="task-list"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
